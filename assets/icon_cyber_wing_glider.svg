<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clean Ice-to-Sky Background so the Navy + Cyan Duotone Mark Pops -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F9FF" />
      <stop offset="100%" stop-color="#D8ECFF" />
    </linearGradient>

    <!-- Cyan Wing Gradient (from Ref 2 Shield) -->
    <linearGradient id="cyanWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4EB" />
      <stop offset="100%" stop-color="#0096C7" />
    </linearGradient>

    <filter id="drop1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1B3B8B" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Squircle Icon Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bg1)" />

  <g filter="url(#drop1)">
    <!-- ==================== UNIFIED MARK 1: CYBER-WING GLIDER ==================== -->
    <!-- A single Paper Plane silhouette whose wings morph directly into PCB circuit nodes,
         with a cloud-contoured underbelly and a keyhole fuselage lock core. -->

    <!-- Left & Right Wing Circuit Traces (Integrated directly into the wing tips) -->
    <g stroke="#1B3B8B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Wing Trailing Circuit Traces -->
      <path d="M 150 212 L 104 212 Q 86 212 86 194 L 86 158" />
      <path d="M 126 266 L 78 266" />
      <!-- Right Lower Wing Circuit Traces -->
      <path d="M 326 356 L 374 356 Q 392 356 392 374 L 392 404" />
      <path d="M 358 304 L 414 304" />
    </g>

    <!-- Circuit Terminal Nodes (Ref 2 Style) -->
    <g fill="#E8F3FF" stroke="#1B3B8B" stroke-width="14">
      <circle cx="86" cy="138" r="20" />
      <circle cx="58" cy="266" r="20" />
      <circle cx="434" cy="304" r="20" />
      <circle cx="392" cy="424" r="20" />
    </g>

    <!-- Main Unified Glider Body (Ice-Blue Cloud-Toned Upper Wing + Cyan Shield-Toned Lower Wing) -->
    <!-- Upper Left Wing (Ref 3 Cloud Ice-Blue #E1F0FF) -->
    <path d="M 108 238
             L 382 104
             Q 408 92 404 120
             L 252 292
             L 184 268
             C 150 256 124 252 108 238 Z"
          fill="#E1F0FF" stroke="#1B3B8B" stroke-width="15" stroke-linejoin="round" />

    <!-- Central Fuselage Fold (Deep Cyan #0096C7) -->
    <path d="M 184 268
             L 400 112
             L 254 368
             Q 238 392 224 364
             L 184 268 Z"
          fill="#0096C7" stroke="#1B3B8B" stroke-width="15" stroke-linejoin="round" />

    <!-- Right Wing (Ref 2 Shield Vibrant Cyan #00B4D8 with Cloud Crescent Highlight) -->
    <path d="M 252 292
             L 404 120
             L 382 352
             Q 378 378 354 362
             L 252 292 Z"
          fill="url(#cyanWing)" stroke="#1B3B8B" stroke-width="15" stroke-linejoin="round" />

    <!-- Integrated Keyhole Core at the Wing-Fuselage Intersection (Ref 2 Lock Motif) -->
    <circle cx="268" cy="248" r="24" fill="#E8F3FF" stroke="#1B3B8B" stroke-width="14" />
    <path d="M 256 268 L 236 302" stroke="#1B3B8B" stroke-width="15" stroke-linecap="round" />

    <!-- Ref 1 Signature Motion Waves Trailing Behind the Tail -->
    <path d="M 128 338 A 52 52 0 0 0 194 334"
          fill="none" stroke="#1B3B8B" stroke-width="15" stroke-linecap="round" />
    <path d="M 92 316 A 94 94 0 0 0 214 374"
          fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round" />
  </g>
</svg>
